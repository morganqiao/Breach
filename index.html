<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>BREACH // SYNDICATE</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@300;500;800&display=swap" rel="stylesheet">

<style>
:root {
--neon-p:#bc13fe; --neon-s:#ff0055; --neon-a:#00d9ff;
--bg:#020205;
}

body {margin:0;background:var(--bg);color:var(--neon-a);font-family:'JetBrains Mono';overflow:hidden;}

.overlay {
position:fixed;inset:0;pointer-events:none;
background:repeating-linear-gradient(0deg,rgba(0,0,0,.3) 0 2px,transparent 2px 4px);
opacity:.4;
}

#main {display:grid;grid-template-columns:300px 1fr 300px;height:100vh;gap:10px;padding:10px;}

.panel {background:rgba(0,0,0,.85);border:1px solid var(--neon-p);padding:15px;}

canvas {width:100%;height:100%;}

button {cursor:pointer;background:none;border:1px solid var(--neon-s);color:var(--neon-s);padding:15px;font-family:Orbitron;}

#tutorial {
position:fixed;inset:0;background:rgba(0,0,0,.9);
display:flex;align-items:center;justify-content:center;z-index:9999;
}

#tutorial-box {
border:1px solid var(--neon-a);padding:25px;max-width:500px;
}
</style>
</head>

<body>

<div class="overlay"></div>

<div id="tutorial">
<div id="tutorial-box">
<h2>TRAINING MODE</h2>
<p id="t-text"></p>
<button onclick="nextTutorial()">NEXT</button>
</div>
</div>

<div id="main">

<div class="panel">
<div>SYNC: <span id="sync">0%</span></div>
<div>MOVES: <span id="moves">15</span></div>
<div>COMBO: <span id="combo">1.0</span></div>
<div id="log"></div>
</div>

<div class="panel">
<canvas id="c"></canvas>
</div>

<div class="panel">
<div>CREDITS: <span id="cr">0</span></div>
<button onclick="execute()">EXECUTE</button>
</div>

</div>

<script>
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

let nodes=[],path=[],credits=0,multi=1;
let moves=15,combo=1,difficulty=1;

const SYM=['Ω','Ψ','Σ','Φ','Δ','Ξ'];

function init(){
const r=canvas.parentElement.getBoundingClientRect();
canvas.width=r.width; canvas.height=r.height;

nodes=[]; moves=15;
document.getElementById("moves").innerText=moves;

for(let y=0;y<5;y++){
for(let x=0;x<8;x++){
let t='NODE';
if(y==2&&x==0)t='IN';
else if(y==2&&x==7)t='OUT';
else if(Math.random()<0.15+difficulty*0.05)t='WALL';

nodes.push({
x:(x+1)*(canvas.width/9),
y:(y+1)*(canvas.height/6),
r:y,c:x,type:t,
sym:SYM[Math.floor(Math.random()*SYM.length)],
active:false
});
}}
solve();
}

function solve(){
nodes.forEach(n=>n.active=false);
let s=nodes.find(n=>n.type=='IN');
let cur=s; path=[s]; s.active=true;

while(true){
let next=nodes.find(n=>!n.active&&n.type!='WALL'&&
Math.abs(n.r-cur.r)+Math.abs(n.c-cur.c)==1 &&
(n.sym==cur.sym||n.type=='OUT'));

if(!next)break;
next.active=true; path.push(next); cur=next;
if(cur.type=='OUT')break;
}

let sync=Math.floor(path.length/9*100);
document.getElementById("sync").innerText=sync+"%";
}

function draw(){
ctx.fillStyle="#000";ctx.fillRect(0,0,canvas.width,canvas.height);

nodes.forEach(n=>{
ctx.beginPath();
if(n.type=='NODE'){
ctx.arc(n.x,n.y,25,0,Math.PI*2);
ctx.strokeStyle=n.active?"#bc13fe":"#222";
ctx.stroke();
ctx.fillStyle="#fff";
ctx.fillText(n.sym,n.x-5,n.y+5);
}
else{
ctx.fillStyle=n.type=='IN'?"#0f0":(n.type=='OUT'?"#bc13fe":"#f05");
ctx.fillRect(n.x-15,n.y-15,30,30);
}
});

if(path[path.length-1].type=='OUT'){
ctx.shadowBlur=20;
ctx.shadowColor="#00ffcc";
}

requestAnimationFrame(draw);
}

canvas.onclick=e=>{
if(moves<=0)return;

const rect=canvas.getBoundingClientRect();
const x=e.clientX-rect.left,y=e.clientY-rect.top;

nodes.forEach(n=>{
if(n.type=='NODE'&&Math.hypot(n.x-x,n.y-y)<30){
n.sym=SYM[(SYM.indexOf(n.sym)+1)%SYM.length];
moves--;
document.getElementById("moves").innerText=moves;
solve();
}
});
};

function execute(){
if(path[path.length-1].type=='OUT'){
combo+=0.5;
let gain=Math.floor(path.length*20*combo);
credits+=gain;
difficulty+=0.2;

log("SUCCESS +"+gain);
init();
}else{
combo=1;
log("FAIL");
}
document.getElementById("combo").innerText=combo.toFixed(1);
document.getElementById("cr").innerText=credits;
}

function log(t){
document.getElementById("log").innerHTML=t+"<br>"+document.getElementById("log").innerHTML;
}

/* tutorial */
let step=0;
const steps=[
"Connect green to purple.",
"Tap nodes to rotate symbols.",
"Matching symbols link.",
"Reach exit then EXECUTE.",
"Earn credits. Increase combo.",
"Good luck."
];

function nextTutorial(){
step++;
if(step>=steps.length){
document.getElementById("tutorial").style.display="none";
return;
}
document.getElementById("t-text").innerText=steps[step];
}
document.getElementById("t-text").innerText=steps[0];

init(); draw();
</script>

</body>
</html>
