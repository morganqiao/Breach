<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>BREACH // SPECTRE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #020204;
            --primary: #bc13fe;
            --secondary: #ff0055;
            --accent: #00d9ff;
            --panel: rgba(8, 8, 12, 0.9);
            --glow-str: 15px;
        }

        body {
            margin: 0; background: var(--bg); color: var(--accent);
            font-family: 'JetBrains Mono', monospace; overflow: hidden; height: 100vh;
        }

        /* 高級螢幕濾鏡：微掃描線 + 顆粒 */
        .crt-overlay {
            position: fixed; inset: 0; pointer-events: none; z-index: 1000;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%),
                        repeating-linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            background-size: 100% 3px, 3px 100%;
            opacity: 0.8;
        }

        /* 介面框架 */
        #os-frame {
            display: grid; grid-template-columns: 320px 1fr 320px; grid-template-rows: 80px 1fr 50px;
            height: 100vh; gap: 15px; padding: 15px; box-sizing: border-box;
        }

        .neo-module {
            background: var(--panel); border: 1px solid rgba(188, 19, 254, 0.2);
            position: relative; box-shadow: inset 0 0 40px rgba(0,0,0,0.9);
            backdrop-filter: blur(15px); display: flex; flex-direction: column;
            border-radius: 4px; transition: border 0.3s;
        }

        header { 
            grid-column: 1 / 4; display: flex; justify-content: space-between; align-items: center; 
            padding: 0 40px; border-bottom: 2px solid var(--primary);
            background: linear-gradient(180deg, rgba(188, 19, 254, 0.1), transparent);
        }

        .logo { 
            font-family: 'Orbitron'; font-weight: 900; font-size: 1.8rem; 
            letter-spacing: 12px; color: #fff; text-shadow: 0 0 var(--glow-str) var(--primary);
        }

        /* 入侵區域 */
        #matrix-container { 
            grid-column: 2; grid-row: 2; position: relative; 
            border: 1px solid rgba(0, 217, 255, 0.3); overflow: hidden;
        }
        canvas { width: 100%; height: 100%; touch-action: none; }

        /* 側邊欄元件 */
        .stat-box { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .stat-label { font-size: 10px; color: #555; letter-spacing: 2px; }
        .stat-value { font-family: 'Orbitron'; font-size: 2.2rem; color: #fff; }

        #terminal-log {
            flex: 1; padding: 20px; font-size: 11px; color: #3a3a4a;
            overflow: hidden; display: flex; flex-direction: column-reverse;
            background: rgba(0,0,0,0.4); border-top: 1px solid rgba(255,255,255,0.02);
        }

        .market-btn {
            background: rgba(255,255,255,0.02); border: 1px solid #1a1a25;
            padding: 20px; margin: 12px; cursor: pointer; transition: 0.2s;
            position: relative;
        }
        .market-btn:active { background: var(--primary); transform: scale(0.96); }
        .market-btn b { display: block; font-size: 14px; color: #fff; }

        .execute-btn {
            background: transparent; border: 1px solid var(--secondary);
            color: var(--secondary); padding: 20px; margin: 12px; font-family: 'Orbitron';
            font-weight: 900; letter-spacing: 4px; cursor: pointer; transition: 0.4s;
        }
        .execute-btn:active { background: var(--secondary); color: #fff; box-shadow: 0 0 30px var(--secondary); }

        /* 動畫線條 */
        svg { position: absolute; inset: 0; pointer-events: none; }
        #path-line { stroke-dasharray: 20; animation: flow 0.6s linear infinite; filter: drop-shadow(0 0 8px var(--primary)); }
        @keyframes flow { to { stroke-dashoffset: -40; } }

        /* Glitch Effect */
        .glitch-flash { animation: glitch 0.2s linear; }
        @keyframes glitch {
            0% { transform: translate(0); filter: hue-rotate(0deg); }
            33% { transform: translate(5px, -2px); filter: hue-rotate(90deg); }
            66% { transform: translate(-5px, 2px); filter: hue-rotate(180deg); }
            100% { transform: translate(0); filter: hue-rotate(0deg); }
        }
    </style>
</head>
<body>

<div class="crt-overlay"></div>

<div id="os-frame">
    <header class="neo-module">
        <div class="logo">BREACH</div>
        <div id="op-id" style="font-size: 12px; color: var(--accent); border: 1px solid var(--accent); padding: 5px 15px; border-radius: 20px;">
            ID: <span id="op-name" style="cursor:pointer">SPECTRE_01</span>
        </div>
    </header>

    <aside class="neo-module">
        <div class="stat-box">
            <div class="stat-label">INTEGRITY</div>
            <div id="sync-val" class="stat-value">0%</div>
        </div>
        <div id="terminal-log"></div>
        <button class="execute-btn" style="border-color: var(--primary); color: var(--primary);" onclick="initGrid()">RESET_GRID</button>
    </aside>

    <main id="matrix-container" class="neo-module">
        <canvas id="gameCanvas"></canvas>
        <svg id="link-svg">
            <path id="path-line" d="" stroke="var(--primary)" stroke-width="4" fill="none" />
            <circle id="node-pulse" r="6" fill="#fff">
                <animateMotion id="pulse-anim" dur="1.5s" repeatCount="indefinite" path="" />
            </circle>
        </svg>
    </main>

    <aside class="neo-module">
        <div class="stat-box">
            <div class="stat-label">CREDITS</div>
            <div id="credit-val" class="stat-value" style="color:var(--secondary)">0000</div>
        </div>
        <div class="market-btn" onclick="upgrade('spike')">
            <b>NEURAL SPIKE</b>
            <span style="font-size: 10px; color: var(--accent);">Boost Data Gain (50 CR)</span>
        </div>
        <div class="market-btn" onclick="upgrade('bypass')">
            <b>BYPASS CHIP</b>
            <span style="font-size: 10px; color: var(--accent);">Remove All Walls (200 CR)</span>
        </div>
        <div style="flex:1"></div>
        <button class="execute-btn" onclick="execute()">EXECUTE_BREACH</button>
    </aside>

    <footer style="grid-column: 1/4; display: flex; justify-content: space-between; padding: 0 30px; font-size: 10px; color: #222;">
        <div>LOCATION: 35.6895° N, 139.6917° E</div>
        <div>CONNECTION: SPECTRE_PROTOCOL_V4</div>
    </footer>
</div>

<script>
    let credits = 0, multi = 1, nodes = [], path = [];
    const SYMBOLS = ['Ω', 'Ψ', 'Σ', 'Φ', 'Δ', 'Ξ'];
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Operator ID
    document.getElementById('op-name').onclick = () => {
        const n = prompt("IDENTITY:");
        if(n) document.getElementById('op-name').innerText = n.toUpperCase();
    };

    function initGrid() {
        const b = canvas.parentElement.getBoundingClientRect();
        canvas.width = b.width; canvas.height = b.height;
        nodes = [];
        const rows = 5, cols = 7;
        for(let r=0; r<rows; r++) {
            for(let c=0; c<cols; c++) {
                let type = 'NODE';
                if(r===2 && c===0) type = 'IN';
                else if(r===2 && c===6) type = 'OUT';
                else if(Math.random() > 0.82) type = 'WALL';
                nodes.push({
                    r, c, type,
                    x: (c+1)*(canvas.width/8),
                    y: (r+1)*(canvas.height/6),
                    sym: SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)],
                    active: false
                });
            }
        }
        solve();
        log("SYSTEM_INITIALIZED");
    }

    function solve() {
        nodes.forEach(n => n.active = false);
        const start = nodes.find(n => n.type==='IN');
        path = [start]; start.active = true;
        let curr = start;

        while(true) {
            let next = nodes.find(n => !n.active && n.type !== 'WALL' &&
                Math.abs(n.r - curr.r) + Math.abs(n.c - curr.c) === 1 &&
                (n.sym === curr.sym || n.type === 'OUT')
            );
            if(next) {
                next.active = true; path.push(next); curr = next;
                if(curr.type==='OUT') break;
            } else break;
        }

        const d = path.map((p,i) => `${i===0?'M':'L'} ${p.x} ${p.y}`).join(' ');
        document.getElementById('path-line').setAttribute('d', d);
        document.getElementById('pulse-anim').setAttribute('path', d);
        document.getElementById('sync-val').innerText = `${Math.floor((path.length/8)*100)}%`;
        draw();
    }

    function draw() {
        // 背景塗黑但保留微量透明感產生拖尾
        ctx.fillStyle = "rgba(2, 2, 4, 0.4)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 繪製格點背景線
        ctx.strokeStyle = "rgba(188, 19, 254, 0.05)";
        ctx.lineWidth = 1;
        for(let i=0; i<canvas.width; i+=50) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }

        nodes.forEach(n => {
            if(n.type === 'NODE') {
                ctx.beginPath();
                ctx.arc(n.x, n.y, 28, 0, Math.PI*2);
                ctx.strokeStyle = n.active ? 'var(--primary)' : '#1a1a2a';
                ctx.lineWidth = n.active ? 4 : 2;
                ctx.stroke();
                
                // 節點光暈
                if(n.active) {
                    ctx.shadowBlur = 15; ctx.shadowColor = "var(--primary)";
                }
                
                ctx.fillStyle = n.active ? '#fff' : '#2a2a3a';
                ctx.font = "bold 18px 'Orbitron'"; ctx.textAlign = "center";
                ctx.fillText(n.sym, n.x, n.y+7);
                ctx.shadowBlur = 0;
            } else {
                ctx.fillStyle = n.type==='IN'?'#39ff14':(n.type==='OUT'?'#bc13fe':'#ff0055');
                ctx.shadowBlur = 20; ctx.shadowColor = ctx.fillStyle;
                ctx.fillRect(n.x-18, n.y-18, 36, 36);
                ctx.shadowBlur = 0;
            }
        });
    }

    function handleInput(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const x = clientX - rect.left, y = clientY - rect.top;

        nodes.forEach(n => {
            if(Math.hypot(n.x-x, n.y-y) < 35 && n.type==='NODE') {
                n.sym = SYMBOLS[(SYMBOLS.indexOf(n.sym)+1)%SYMBOLS.length];
                // 增加點擊時的 Glitch 感
                document.getElementById('matrix-container').classList.add('glitch-flash');
                setTimeout(() => document.getElementById('matrix-container').classList.remove('glitch-flash'), 200);
                solve();
            }
        });
    }

    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleInput(e); });
    canvas.addEventListener('mousedown', handleInput);

    function upgrade(t) {
        if(t==='spike' && credits >= 50) {
            credits -= 50; multi += 0.8; log("NEURAL_SPIKE: ONLINE");
        } else if(t==='bypass' && credits >= 200) {
            credits -= 200; nodes = nodes.filter(n => n.type !== 'WALL');
            log("FIREWALL_BYPASS: SUCCESS");
        } else {
            log("INSUFFICIENT_CREDITS"); return;
        }
        updateUI(); solve();
    }

    function execute() {
        if(path[path.length-1].type === 'OUT') {
            const gain = Math.floor(path.length * 15 * multi);
            credits += gain;
            log(`BREACH_SUCCESS: +${gain} CR`);
            initGrid();
        } else {
            log("ERROR: LINK_SEVERED");
            document.body.classList.add('glitch-flash');
            setTimeout(() => document.body.classList.remove('glitch-flash'), 200);
        }
        updateUI();
    }

    function log(m) {
        const t = document.getElementById('terminal-log');
        const ts = new Date().toLocaleTimeString().split(' ')[0];
        t.innerHTML = `<div><span style="color:var(--primary)">[${ts}]</span> ${m}</div>` + t.innerHTML;
    }

    function updateUI() {
        document.getElementById('credit-val').innerText = credits.toString().padStart(4, '0');
    }

    window.addEventListener('resize', initGrid);
    initGrid();
</script>
</body>
</html>
