<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BREACH v3</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=JetBrains+Mono&display=swap" rel="stylesheet">

<style>
body {
margin:0;
background:#020205;
color:#00d9ff;
font-family:'JetBrains Mono';
overflow:hidden;
}

#ui {
position:fixed; top:0; left:0; right:0;
display:flex; justify-content:space-between;
padding:10px 20px;
font-size:12px;
}

canvas { display:block; }

#tutorial {
position:fixed; inset:0;
background:rgba(0,0,0,.9);
display:flex; align-items:center; justify-content:center;
z-index:10;
}

#box {
border:1px solid #00d9ff;
padding:25px;
max-width:500px;
}
button {
background:none;
border:1px solid #00d9ff;
color:#00d9ff;
padding:10px;
margin-top:15px;
}
</style>
</head>

<body>

<div id="tutorial">
<div id="box">
<h2>BREACH TRAINING</h2>
<p id="t"></p>
<button onclick="next()">NEXT</button>
</div>
</div>

<div id="ui">
<div>STABILITY: <span id="hp">100</span></div>
<div>CREDITS: <span id="cr">0</span></div>
<div>COMBO: <span id="cb">1</span></div>
</div>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

let nodes=[], path=[], dragging=false;
let credits=0, combo=1, stability=100;

const SIZE=6;

function resize(){
canvas.width=innerWidth;
canvas.height=innerHeight;
}
window.onresize=resize;
resize();

/* CREATE GRID WITH GUARANTEED SOLUTION */
function init(){
nodes=[]; path=[];
stability=100;

let solution=[];
for(let i=0;i<SIZE;i++){
solution.push({r:i,c:i});
}

for(let r=0;r<SIZE;r++){
for(let c=0;c<SIZE;c++){

let isPath = solution.find(p=>p.r==r&&p.c==c);

nodes.push({
r,c,
x:(c+1)*(canvas.width/(SIZE+1)),
y:(r+1)*(canvas.height/(SIZE+1)),
type: isPath ? "PATH" : "FAKE",
active:false
});
}
}
}

/* INPUT */
canvas.onmousedown=e=>{
dragging=true;
path=[];
handle(e);
};
canvas.onmousemove=e=>{
if(dragging) handle(e);
};
canvas.onmouseup=()=>dragging=false;

function handle(e){
const rect=canvas.getBoundingClientRect();
const x=e.clientX-rect.left;
const y=e.clientY-rect.top;

nodes.forEach(n=>{
if(Math.hypot(n.x-x,n.y-y)<30){
if(!path.includes(n)){
path.push(n);
n.active=true;
}
}
});
}

/* GAME LOGIC */
function update(){
if(path.length>1){
for(let i=1;i<path.length;i++){
let a=path[i-1], b=path[i];
if(Math.abs(a.r-b.r)+Math.abs(a.c-b.c)>1){
fail();
return;
}
}
}
}

function fail(){
stability-=5;
combo=1;
path=[];

if(stability<=0){
credits=0;
init();
}
}

function success(){
let score = Math.floor(path.length*10*combo);
credits+=score;
combo+=0.5;
init();
}

/* DRAW */
function draw(){
ctx.fillStyle="#020205";
ctx.fillRect(0,0,canvas.width,canvas.height);

nodes.forEach(n=>{
ctx.beginPath();
ctx.arc(n.x,n.y,20,0,Math.PI*2);
ctx.strokeStyle = n.active ? "#bc13fe" : "#222";
ctx.stroke();
});

if(path.length>1){
ctx.beginPath();
ctx.moveTo(path[0].x,path[0].y);
for(let p of path){
ctx.lineTo(p.x,p.y);
}
ctx.strokeStyle="#00d9ff";
ctx.lineWidth=3;
ctx.stroke();
}

update();

if(path.length>5){
success();
path=[];
}

document.getElementById("hp").innerText=stability;
document.getElementById("cr").innerText=credits;
document.getElementById("cb").innerText=combo.toFixed(1);

requestAnimationFrame(draw);
}

/* TUTORIAL */
let step=0;
const steps=[
"Drag across nodes.",
"Stay connected (no jumping).",
"Longer paths = more credits.",
"Mistakes reduce stability.",
"Chain combos for big score."
];

function next(){
step++;
if(step>=steps.length){
document.getElementById("tutorial").style.display="none";
return;
}
document.getElementById("t").innerText=steps[step];
}
document.getElementById("t").innerText=steps[0];

init();
draw();
</script>

</body>
</html>
